  id: TailPoodle
  parent: BaseTailMarking
  sprites:
  - sprite: _Everdream/Mobs/Customization/poodle.rsi
    state: poodle_tail_primary
  - sprite: _Everdream/Mobs/Customization/poodle.rsi
    state: poodle_tail_secondary

- type: marking
  id: TailPoodleAnimated
  parent: BaseTailMarking
  sprites:
