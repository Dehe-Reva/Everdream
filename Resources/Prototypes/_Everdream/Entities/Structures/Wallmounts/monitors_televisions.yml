- type: entity
  parent: WallmountTelescreenFrame
  id: WallmountTelevisionFrame-Spooky
  name: television frame
  description: Feels likes someone is watching...
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.75,-0.10,0.75,0.35"
        density: 75
        mask:
          - FullTileMask
        layer:
          - WallLayer
  - type: Construction
    graph: WallmountTelevision
    node: TelevisionFrame
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _Everdream/Structures/Wallmounts/flatscreentvscary.rsi
    layers:
      - map: ["computerLayerBody"]
        state: television_wall
      - map: ["computerLayerScreen"]
        state: television_wallscreen

- type: entity
  parent: WallmountTelevisionFrame-Spooky
  id: WallmountTelevision-Spooky
  suffix: entertainment
  name: television-spooky
  description: Feels like someone is watching...
  components:
  - type: Construction
    graph: WallmountTelevision
    node: Television
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: SurveillanceCameraEntertainment
    transmitFrequencyId: SurveillanceCameraEntertainment
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceNetworkRequiresPower
  - type: Speech
  - type: SurveillanceCameraSpeaker
  - type: SurveillanceCameraMonitor
  - type: ActivatableUI
    key: enum.SurveillanceCameraMonitorUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
        enum.SurveillanceCameraMonitorUiKey.Key:
          type: SurveillanceCameraMonitorBoundUserInterface
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#b89f25"

